sonar.projectKey=giauphan_toolcase-gateway
sonar.organization=giauphan

# Exclude files from code coverage metrics in SonarCloud
sonar.coverage.exclusions=**

# Ignore CLI/agent path traversal rules on local helper scripts
sonar.issue.ignore.multicriteria=e1,e2
sonar.issue.ignore.multicriteria.e1.ruleKey=pythonsecurity:S8707
sonar.issue.ignore.multicriteria.e1.resourceKey=scripts/**
sonar.issue.ignore.multicriteria.e2.ruleKey=pythonsecurity:S2083
sonar.issue.ignore.multicriteria.e2.resourceKey=scripts/**

# This is the name and version displayed in the SonarCloud UI.
#sonar.projectName=toolcase-gateway
#sonar.projectVersion=1.0

# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
#sonar.sources=.

# Encoding of the source code. Default is default system encoding
#sonar.sourceEncoding=UTF-8
